name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: b01pdf-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supersede:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cancel older builds before publication
        run: |
          gh run list --workflow build.yml --branch main --limit 20 --json databaseId,headSha,status --jq '.[] | select(.status != "completed") | [.databaseId, .headSha] | @tsv' > runs.tsv
          while read -r run_id run_sha; do
            if [ "$run_sha" != "$GITHUB_SHA" ]; then gh run cancel "$run_id" || true; fi
          done < runs.tsv
  windows:
    needs: supersede
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.19.0
      - name: Test PDF rendering and viewer behavior
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Collect upstream license notices
        run: python tools/prepare_notices.py
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name B01PDF --icon assets/B01PDF.ico --add-data "assets;assets" --add-data "THIRD_PARTY.md;." --add-data "LICENSE;." --add-data "notices;notices" --copy-metadata Pillow app.py
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/B01PDF/B01PDF.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Application startup timed out" }
          if ($process.ExitCode -ne 0) { throw "Packaged application failed with exit code $($process.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup 6 is missing" }
          & $compiler installer/B01PDF.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Program Files installation and startup
        shell: pwsh
        run: |
          $installer = Start-Process -FilePath "dist/installer/B01PDF-Setup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Installation failed with exit code $($installer.ExitCode)" }
          $entry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\{D9766A7B-123B-426D-8E04-108F11816A65}_is1'
          if ($entry.DisplayName -ne "B01PDF") { throw "Unexpected installed display name: $($entry.DisplayName)" }
          if ($entry.DisplayVersion -ne "0.7.0") { throw "Unexpected installed version: $($entry.DisplayVersion)" }
          $executable = Join-Path $env:ProgramFiles "B01PDF/B01PDF.exe"
          if (-not (Test-Path $executable)) { throw "The default Program Files installation is missing" }
          $process = Start-Process -FilePath $executable -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Installed application startup timed out" }
          if ($process.ExitCode -ne 0) { throw "Installed application failed" }
      - name: Verify update installer self-cleanup
        shell: pwsh
        run: |
          $folder = Join-Path $env:TEMP ("B01PDF-update-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $folder | Out-Null
          $exe = Join-Path $folder "B01PDF-Setup.exe"
          Copy-Item "dist/installer/B01PDF-Setup.exe" $exe
          $process = Start-Process -FilePath $exe -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Update installation failed" }
          for ($i = 0; $i -lt 30 -and (Test-Path $folder); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $folder) { throw "Update installer temporary folder was not removed" }
      - uses: actions/upload-artifact@v4
        with:
          name: B01PDF-Windows-Setup
          path: dist/installer/B01PDF-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: B01PDF-Windows-Portable
          path: dist/B01PDF/
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: windows
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: B01PDF-Windows-Setup
          path: installer
      - name: Publish tested installer as version 0.7
        shell: bash
        run: |
          test -s installer/B01PDF-Setup.exe
          cd installer
          zip -9 ../B01PDF-0.7-Windows-Setup.zip B01PDF-Setup.exe
          cd ..
          unzip -t B01PDF-0.7-Windows-Setup.zip
          cat > notes.md <<'EOF'
          Version 0.7 for Windows.

          - Update installers automatically remove their EXE and temporary folder after the installer exits, including cancellation.
          - Abandoned update folders older than 24 hours are cleaned on application startup; locked installers are left for a later attempt.

          Extract B01PDF-0.7-Windows-Setup.zip and run B01PDF-Setup.exe, or update through Settings > Check for Updates. User preferences are preserved.
          EOF
          if gh release view v0.7 >/dev/null 2>&1; then
            echo "Release v0.7 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v0.7 B01PDF-0.7-Windows-Setup.zip --target "$GITHUB_SHA" --title "Version 0.7" --notes-file notes.md --latest

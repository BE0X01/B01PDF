name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: b01pdf-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supersede:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cancel older builds before publication
        run: |
          gh run list --workflow build.yml --branch main --limit 20 --json databaseId,headSha,status --jq '.[] | select(.status != "completed") | [.databaseId, .headSha] | @tsv' > runs.tsv
          while read -r run_id run_sha; do
            if [ "$run_sha" != "$GITHUB_SHA" ]; then gh run cancel "$run_id" || true; fi
          done < runs.tsv
  windows:
    needs: supersede
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.19.0
      - name: Test PDF rendering and viewer behavior
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Collect upstream license notices
        run: python tools/prepare_notices.py
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name B01PDF --add-data "THIRD_PARTY.md;." --add-data "LICENSE;." --add-data "notices;notices" --copy-metadata Pillow app.py
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/B01PDF/B01PDF.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Application startup timed out" }
          if ($process.ExitCode -ne 0) { throw "Packaged application failed with exit code $($process.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup 6 is missing" }
          & $compiler installer/B01PDF.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Program Files installation and startup
        shell: pwsh
        run: |
          $installer = Start-Process -FilePath "dist/installer/B01PDF-Setup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -PassThru -Wait
          if ($installer.ExitCode -ne 0) { throw "Installation failed with exit code $($installer.ExitCode)" }
          $executable = Join-Path $env:ProgramFiles "B01PDF/B01PDF.exe"
          if (-not (Test-Path $executable)) { throw "The default Program Files installation is missing" }
          $process = Start-Process -FilePath $executable -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(30000)) { $process.Kill(); throw "Installed application startup timed out" }
          if ($process.ExitCode -ne 0) { throw "Installed application failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: B01PDF-Windows-Setup
          path: dist/installer/B01PDF-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: B01PDF-Windows-Portable
          path: dist/B01PDF/
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: windows
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: B01PDF-Windows-Setup
          path: installer
      - name: Publish tested installer as version 0.3
        shell: bash
        run: |
          test -s installer/B01PDF-Setup.exe
          cd installer
          zip -9 ../B01PDF-0.3-Windows-Setup.zip B01PDF-Setup.exe
          cd ..
          unzip -t B01PDF-0.3-Windows-Setup.zip
          cat > notes.md <<'EOF'
          Version 0.3 for Windows.

          - Fit Width and Fit Page are persistent, highlighted view states; manual zoom clears both highlights.
          - Oversized pages scroll vertically before turning the page at the boundary. Shift+wheel pans horizontally without changing pages.
          - Drag with the left mouse button to pan an enlarged page.
          - Sidebar thumbnails scale with sidebar width.
          - Theme toggle label switches between Dark and Light.
          - New installations default to Program Files\B01PDF.

          Extract B01PDF-0.3-Windows-Setup.zip and run B01PDF-Setup.exe. Installation now requires administrator permission because the default location is Program Files. User settings are preserved.

          Windows behavior tests and packaged executable startup checks passed before publication.
          EOF
          if gh release view v0.3 >/dev/null 2>&1; then
            echo "Release v0.3 already exists; leaving it unchanged."
            exit 0
          fi
          gh release create v0.3 B01PDF-0.3-Windows-Setup.zip --target "$GITHUB_SHA" --title "Version 0.3" --notes-file notes.md --latest
